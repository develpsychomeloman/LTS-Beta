name: Build FullPlayer
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: unzip -q FullPlayer.zip
      - run: gradle assembleRelease bundleRelease
        working-directory: FullPlayer
      - uses: actions/upload-artifact@v4
        with:
          name: FullPlayer-release
          path: |
            FullPlayer/app/build/outputs/apk/release/app-release.apk
            FullPlayer/app/build/outputs/bundle/release/app-release.aab
